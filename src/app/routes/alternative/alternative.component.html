<nz-card
  nzTitle="{{ 'Alternative Methods' | i18n }}"
  [nzExtra]="extraTemplate"
  [nzLoading]="loading"
>
  <iframe
    *ngIf="ifromUrl"
    style="width: 100%; height: 720px"
    frameborder="0"
    [src]="ifromUrl"
  ></iframe>
</nz-card>
<ng-template #extraTemplate>
  <button nz-button nzType="primary" class="cpt-tab-btn" (click)="goBack()">
    <i nz-icon nzType="left"></i>{{ 'Back' | i18n }}
  </button>
</ng-template>

<!-------maximum exceed number ------------->
<nz-modal
  [(nzVisible)]="exceed"
  [nzWidth]="600"
  nzOkText="{{ 'Submit' | i18n }}"
  nzCancelText="{{ 'Back' | i18n }}"
  nzClassName="cpt-modal home-modal"
  [nzFooter]="null"
>
  <ng-container *nzModalContent>
    <div class="exceed-modal">
      <ng-container *ngIf="kycMessage; else otherKycMsg">
        <h1>
          {{
            'You have exceeded the maximum allowed deposit limit, before KYC.
          Please complete your profile to unlock the unlimited deposit and many
          other exciting features.'
              | i18n
          }}
        </h1>
      </ng-container>

      <ng-template #otherKycMsg>
        <h1>
          {{ 'Account verification is required for deposit above 300$' | i18n }}
        </h1>
      </ng-template>
      <button
        nz-button
        class="cpt-primary-btn cmn-btn mb-2"
        [nzType]="'primary'"
        (click)="goVerify()"
      >
        {{ 'Complete Profile' | i18n }}
      </button>
    </div>
  </ng-container>
</nz-modal>
