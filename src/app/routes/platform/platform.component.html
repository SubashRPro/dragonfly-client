<nz-card class="platform-card">
  <nz-tabset class="platform-tabs">
    <nz-tab nzTitle="{{ 'MT4' | i18n }}">

          platformTemplate;

            logo: 'assets/mt4-logo.png',
            title: 'MetaTrader 4',
            description: 'A user-friendly',
            steps: ['Download and install MT4', 'Login with your account details'],
            features: [
              'No need for Boot Camp or Parallels Desktop',
              'Over 1000 instruments including Forex, CFDs, and Futures',
              'Spreads as low as 0.6 pips',
              'Full EA (Expert Advisor) Functionality',
              '1 Click Trading',
              'Technical Analysis Tools with 50 indicators and charting tools',
              '3 Chart Types',
              'Micro Lot Accounts',
              'Hedging Allowed'
            ],
            links: [
              {
                url: 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/metatrader4.apk?utm_source=www.metatrader4.com&utm_campaign=install.metaquotes',
                icon: 'assets/android-icon.svg',
                label: 'Android'
              },
              {
                url: 'https://download.mql5.com/cdn/mobile/mt4/android?utm_source=www.metatrader4.com&utm_campaign=install.metaquotes',
                icon: 'assets/images/playstore.png',
                label: 'Google Play'
              },
              {
                url: 'https://download.mql5.com/cdn/web/22980/mt4/triveinternational4setup.exe',
                icon: 'assets/win-icon.svg',
                label: 'Windows'
              },
              {
                url: 'https://download.mql5.com/cdn/web/metaquotes.software.corp/mt4/MetaTrader4.pkg.zip',
                icon: 'assets/apple-icon.svg',
                label: 'MacOS'
              },
              {
                url: 'https://download.mql5.com/cdn/mobile/mt4/ios?server=TriveInternational-Demo-1,TriveInternational-Live-1,TriveInternational-Live-1.2,TriveInternational-Live-1.3,TriveInternational-Live-1.4,TriveInternational-Live-1.5',
                icon: 'assets/images/app-desktop.png',
                label: 'iOS'
              }
            ]
          }
        "
      ></ng-container>
    </nz-tab>

    <nz-tab nzTitle="{{ 'MT5' | i18n }}">
      <ng-container
        *ngTemplateOutlet="
          platformTemplate;
          context: {
            logo: 'assets/mt5-logo.png',
            title: 'MetaTrader 5',
            description: 'or MetaTrader 5',
            steps: [
              'Create an account (Live or Demo)',
              'Download and install MT5',
              'Login with your account details'
            ],
            features: [
              'Intuitive interface',
              'Fully customizable',
              'Advanced analytics',
              'Flexible and convenient',
              'Secure and stable platform',
              'Industry-favourite choice',
              'MetaTrader 5 expert advisors',
              'More assets, more opportunities',
              'Available for Windows or Mac'
            ],
            links: [
              {
                url: 'https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5&hl=en_IN',
                icon: 'assets/android-icon.svg',
                label: 'Android'
              },
              {
                url: 'https://play.google.com/store/apps/details?id=net.metaquotes.metatrader5&hl=en_IN',
                icon: 'assets/images/playstore.png',
                label: 'Google Play'
              },
              {
                url: 'https://download.mql5.com/cdn/web/22984/mt5/triveinternational5setup.exe',
                icon: 'assets/win-icon.svg',
                label: 'Windows'
              },
              {
                url: 'https://download.mql5.com/cdn/mobile/mt5/ios?server=TriveInternational-MT5-Demo1,TriveInternational-MT5Live-1,TriveInternational-MT5Live-2',
                icon: 'assets/apple-icon.svg',
                label: 'iOS'
              },
              {
                url: 'https://download.mql5.com/cdn/web/metaquotes.ltd/mt5/MetaTrader5.pkg.zip?utm_source=chatgpt.com&utm_campaign=download.mt5.macos',
                icon: 'assets/images/app-desktop.png',
                label: 'MacOS'
              }
            ]
          }
        "
      ></ng-container>
    </nz-tab>
  </nz-tabset>
</nz-card>

<ng-template
  #platformTemplate
  let-logo="logo"
  let-title="title"
  let-description="description"
  let-features="features"
  let-steps="steps"
  let-links="links"
>
  <div nz-row [nzGutter]="32" class="platform-layout">
    <div nz-col nzXs="24" nzMd="13" class="platform-info">
      <div class="platform-brand">
        <img [src]="logo" [alt]="title" />
      </div>

      <p class="platform-description">
        {{ description | i18n }}
      </p>

      <div class="features-grid">
        <div class="feature-item" *ngFor="let feature of features">
          <span class="check-icon">✓</span>
          <span>{{ feature | i18n }}</span>
        </div>
      </div>
    </div>

    <div nz-col nzXs="24" nzMd="11">
      <div class="download-card">
        <h2>{{ 'Download Platform' | i18n }}</h2>

        <p class="download-desc">
          {{ 'Downloading' | i18n }} {{ title }} {{ 'is simple and easy, follow these steps:' | i18n }}
        </p>

        <div class="steps-list">
          <div class="step-item" *ngFor="let step of steps; let i = index">
            <span>{{ i + 1 }}</span>
            <p>{{ step | i18n }}</p>
          </div>
        </div>

        <h4>{{ 'AVAILABLE FOR' | i18n }}</h4>

        <div class="download-icons">
          <a
            *ngFor="let item of links"
            [href]="item.url"
            target="_blank"
            class="download-icon"
          >
            <img [src]="item.icon" [alt]="item.label" />
            <span>{{ item.label }}</span>
          </a>
        </div>
      </div>
    </div>
  </div>
</ng-template>
